# The reviewer's critical #5 was manuscript-vs-artifact drift, and its fix asked
# for the audit to run in CI rather than only when someone remembers. Every
# number in the manuscript is derivable from results_v2/ with no network and no
# GPU, so this is a ~30-second job on the free runner.
name: verify-paper-numbers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # numpy is the only dependency of the derive/audit path. Deliberately not
      # installing torch or transformers: if the audit ever needs them, a number
      # is being recomputed from a model instead of read from a released record,
      # which is the thing this check exists to prevent.
      - run: pip install --quiet numpy
      - name: Re-derive metrics from the released per-sample records
        run: python scripts/derive_metrics.py
      - name: Fail if derive_metrics.py changed derived_metrics.json
        # The committed derived file must already be what the raw reports imply.
        # A diff here means the release and the manuscript's input disagree.
        # The diff itself is printed: this gate spent several pushes failing for
        # a reason invisible from the exit code alone (absolute paths, not
        # numbers), and it cannot be reproduced on a machine that still has the
        # authors' /tmp scratch runs lying around.
        run: |
          if ! git diff --quiet -- results_v2/derived_metrics.json; then
            git diff --stat -- results_v2/derived_metrics.json
            D=$(git diff -U0 -- results_v2/derived_metrics.json \
                  | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | head -30)
            echo "$D"
            # Also emit the diff as a workflow annotation. The step log lives in
            # blob storage that some networks cannot reach, whereas annotations
            # come back from the REST API, and this gate is useless if the
            # reason it fired is unreadable.
            ENC=$(printf '%s' "$D" | python3 -c \
              'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')
            echo "::error::derived_metrics.json drifted on a clean checkout:%0A$ENC"
            exit 1
          fi
      - name: Assert every number quoted in the manuscript
        run: python scripts/verify_paper_numbers.py
      # Pure numpy, and deliberately written to run without torch so it belongs
      # in this job rather than in a GPU one. It guards the gripper convention
      # that the decoder gate turns on: if the four A/B arms ever stop being
      # distinct, the experiment silently compares an arm against itself.
      - name: Gripper-transform arms stay distinct and side-effect-free
        run: python tests/test_gripper_transform.py
