name: 'CoT-Faith #16b: DeepThinkVLA base decode equivalence at a token budget that lets the CoT terminate'
description: 'Closes the one undefined cell of #16 (bolt 8cvg2daria). That job returned EQUIVALENT on 12/12 comparable frames for deepthinkvla_libero_cot_sft and _rl -- build_input_cot_ids reproduces the checkpoint own input_cot_ids byte-identically, action_start_idx agrees, decode_action_chunk reproduces the (10,7) chunk at max abs diff 0.0 -- but deepthinkvla_base came back UNDEFINED: 0/12 comparable, 12/12 no_stop_tail. At MAX_NEW_TOKENS=320 it never emitted upstream own stop tail, so nothing was compared against a sequence it produced, which measures nothing about our decode. Same audit, that checkpoint alone, 768 tokens. It matters because every published DeepThinkVLA number for the base row was decoded through the path under test, so that row is currently unaudited rather than audited-and-passing. Both outcomes are reportable: the CoT terminates and the verdict resolves, or it does not, which is a property of the checkpoint and bounds the row explicitly. Minutes of GPU.'
tags: ['cotfaith', 'deepthink', 'decode-equivalence', 'audit', 'followup']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 3h
  cluster: aws_6

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  # Only the checkpoint that came back undefined. The other two are settled and
  # rerunning them would just re-download 2x14 GB to reprint a known verdict.
  CKPTS: 'yinchenghust/deepthinkvla_base'
  N_SAMPLES: '12'
  # 320 -> 768. #16 recorded mean_cot_tokens 72.7 on the checkpoints that DO
  # terminate, so base is not merely a little over the old budget; either it
  # runs long or it does not terminate at all, and 768 separates those two.
  MAX_NEW_TOKENS: '768'
  SEED: '0'
  DTYPE: 'bfloat16'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_dt_decode_equivalence.sh
