name: 'CoT-Faith Stage 3 gate: paired rollout-level CoT edit, on the 8x-budget checkpoint'
description: 'Same protocol as bolt/boltconfig-cotfaith-rollout-edit-ckpt-lm90.yaml (which produced the papers published SR(cot_clean)=0/40 on the r=32, 15k-step checkpoint bcihypv3gu), pointed at the Stage 3 gate checkpoint (task 3xrnsh3xsz: same r=32/LR=2e-5/libero_lm_90 recipe, 8x the steps, 120000 not 15000) instead. Same action-decoder=ours, unnorm-key=identity, suite=libero_90, MAX_STEPS=0 (suites own 400-step budget), N_TASKS=0/N_EPS_PER_TASK=1 (all 90 tasks, one episode each, clock decides how many complete), same 20h time budget. Binding question: is SR(cot_clean) now nonzero -- the reviewers Stage 3 gate is SR>=0.4 before Stage 4s paired ASR rollout is authorized.'
tags: ['cotfaith', 'stage3', 'rollout-edit', 'competence-gate', 'reviewer-priority']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 24h
  cluster: aws_6

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  AWS_ACCESS_KEY_ID: ${CKPT_AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${CKPT_AWS_SECRET_ACCESS_KEY}
  S3_ENDPOINT_URL: 'https://conductor.data.apple.com'
  CKPT_TASK_ID: '3xrnsh3xsz'

  SUITE: 'libero_90'
  ACTION_DECODER: 'ours'
  UNNORM_KEY: ''
  # direction_flip failed cotfaith_rollout_edit.py's own probe (task ecprewycrg):
  # the probe tests applicability on ONLY suite.get_task(0), which for
  # libero_90 is "close the top drawer of the cabinet" -- no direction word to
  # flip, so the probe (correctly, on that one task) reports the family
  # inapplicable and aborts before ever reaching the other 89 tasks, where
  # direction_flip plainly IS applicable (it has real n throughout this
  # paper's own leaderboard). paraphrase_null does synonym substitution, not a
  # specific semantic feature, so it passes the probe on task 0 too -- and the
  # gate only needs SR(cot_clean), which does not depend on which family rides
  # alongside it.
  FAMILIES: 'paraphrase_null'
  GRIPPER_TRANSFORM: 'openvla'
  IMAGE_PREPROC: 'none'
  MAX_NEW_TOKENS: '320'
  MAX_STEPS: '0'
  N_TASKS: '0'
  N_EPS_PER_TASK: '1'
  TIME_BUDGET_H: '20'
  DTYPE: 'bfloat16'
  PROBE_ONLY: '0'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_rollout_edit_s3.sh
