name: 'CoT-Faith: export full-length CoT edit pairs for the task-examples figure'
description: 'The task-examples figure has to show a reader what an edit family actually IS, in real text. The released judge_pairs.json stores only the first 400 characters of each trace, and the ECoT format puts TASK/PLAN/VISIBLE OBJECTS ahead of the MOVE tag -- so the head is cut off before the span direction_flip, negation and syntactic_scramble rewrite, and those three families are byte-identical across all 40 of their released heads. A figure built from the heads would show 3 of 11 families as "no change", which is false. This re-derives the pairs at full length by re-running the judge run own build_pairs() at its recorded seed and corpus, then asserts every regenerated pair reproduces the released 400-char head byte for byte and writes nothing if any does not. Pure string manipulation, no model loaded; it runs here because the 432MB reasoning corpus stalls at 0 bytes through the authoring host proxy.'
tags: ['cotfaith', 'figures', 'paper', 'edit-examples']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu   # nothing here uses the GPU; 1gpu is the smallest shape that schedules promptly
  disk_gb: 32       # the 432MB corpus and nothing else -- no setup_command, so no torch wheels
  timeout: 40m
  cluster: aws_2

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

command: bash bolt/run_export_edit_examples.sh