name: 'CoT-Faith baseline: OpenVLA-7B-libero-10 attention (N=100)'
description: 'Non-CoT baseline attention analysis on OpenVLA-7B fine-tuned for LIBERO-10. Same LIBERO samples as CoT-VLA rvis run, so we can compare per-bucket attention (action->{visual, instr, action_prev}) against the CoT-VLA numbers.'
tags: ['cotfaith', 'baseline', 'libero-10', 'N100']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 4h
  cluster: aws_2

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  BASE_MODEL: 'openvla/openvla-7b-finetuned-libero-10'
  N_SAMPLES: '100'
  RVIS_LAYERS: '0,1,2,3'
  DTYPE: 'bfloat16'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_rvis_baseline.sh
  SEED: "1"
