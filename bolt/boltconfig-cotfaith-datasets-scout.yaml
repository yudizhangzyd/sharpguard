name: 'CoT-Faith: scout HF for additional datasets (Bridge V2 / RT-1 / CALVIN / RoboCasa)'
description: 'Probe 15+ HF dataset repositories to identify additional evaluation datasets. Bridge V2 raw, RT-1, CALVIN, RoboCasa, SimplerEnv reference tasks, community CoT-annotated variants.'
tags: ['cotfaith', 'scout', 'datasets']

project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 128
  timeout: 30m
  cluster: aws_2
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_datasets_scout.sh
