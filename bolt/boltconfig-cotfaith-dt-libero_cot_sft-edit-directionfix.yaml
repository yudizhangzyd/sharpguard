name: 'CoT-Faith DT-libero_cot_sft edit re-run under corrected DIRECTION_PAIRS'
description: 'Re-run of the DT-SFT 10-family causal edit protocol: DIRECTION_PAIRS in/out pair removed from sharpguard/attacks/cot_edit.py (found 100% idiom/position-reference noise, 0 genuine spatial reversals, across all 633 real occurrences enumerated from libero_reasonings.json). No --families flag on this script, so this reruns the full family set + rvis; only direction_flip actually changes.'
tags: ['cotfaith', 'deepthink', 'edit', 'libero_cot_sft', 'direction-flip-fix']
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 8h
  cluster: aws_6                # NOT aws_10: p6-b200 is sm_100 and this image's torch stops at sm_90
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_HF_ID: 'yinchenghust/deepthinkvla_libero_cot_sft'
  N_SAMPLES: '100'
  THRESHOLD: '0.05'
  DTYPE: 'bfloat16'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_deepthink.sh
