name: 'CoT-Faith DT-libero_cot_sft edit families (N=100)'
description: 'DeepThinkVLA-libero_cot_sft 10-family causal edit protocol. Fills leaderboard gap identified by R3 reviewer (DT was attention-only, causal-edit family coverage was 1).'
tags: ['cotfaith', 'deepthink', 'edit', 'libero_cot_sft']
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 8h
  cluster: aws_10
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_HF_ID: 'yinchenghust/deepthinkvla_libero_cot_sft'
  N_SAMPLES: '100'
  THRESHOLD: '0.05'
  DTYPE: 'bfloat16'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_deepthink.sh
