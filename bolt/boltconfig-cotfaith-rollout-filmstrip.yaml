name: 'CoT-Faith #10d: filmstrip capture -- what the three rollout arms actually DO'
description: 'Filmstrip capture, take 3: second pairing fix. Take 1 (h8xzmqnhgg) built a fresh env per arm, so robosuite re-sampled the welded fixtures, whose pose is in the MODEL and not in the qpos that set_init_state restores: at step 0 the arms were bit-identical outside a box over 10.4 pct of the frame and differed by 8.8411 inside it, cut to 2.7762 by a 3 px shift -- the drawer they were asked to close. Take 2 (xyiztdu4n6) shared one env per episode and pinned the fixture, but each arm still ran its own 10-step settle, and the second arm entered it carrying the previous arm OSC goal and the MuJoCo warm-start accelerations, which set_init_state does not restore: 31.7356 mean dpix inside rows 0-134 cols 96-188, best rigid shift (0,0) -- a different robot pose, not a moved object. Now the settle runs ONCE per episode and every arm is rewound to that snapshot with both channels cleared. Hard-fails if step-0 pixels differ. Same ckpt bcihypv3gu, in-suite libero_90.'
tags: ['cotfaith', 'rollout-edit', 'figure', 'filmstrip', 'limitation-v']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 24h
  cluster: aws_6

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  # Task-scoped, expiring read token for the checkpoint task's artifact prefix,
  # substituted at submit time by bolt/submit_rollout_edit_ckpt.sh. The pod has
  # no IAM role for this bucket.
  AWS_ACCESS_KEY_ID: ${CKPT_AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${CKPT_AWS_SECRET_ACCESS_KEY}
  S3_ENDPOINT_URL: 'https://conductor.data.apple.com'
  CKPT_TASK_ID: 'bcihypv3gu'

  # In-suite, for the same reason round 2 is: this checkpoint LoRA-trained on
  # libero_lm_90, so libero_spatial frames would show a policy acting in a
  # distribution it has never seen -- a picture of the wrong failure.
  SUITE: 'libero_90'
  ACTION_DECODER: 'ours'
  UNNORM_KEY: ''
  FAMILIES: 'direction_flip'
  GRIPPER_TRANSFORM: 'openvla'
  IMAGE_PREPROC: 'none'
  MAX_NEW_TOKENS: '320'
  MAX_STEPS: '0'          # upstream's own libero_90 budget (400)

  # Two tasks, one episode each. This run is not estimating anything, so the
  # episode count is set by what a figure needs -- a second task so the figure
  # is not one cherry-picked scene -- not by statistical power.
  N_TASKS: '2'
  N_EPS_PER_TASK: '1'

  # The capture itself. Named episodes, not a count: the filmstrip compares
  # arms on ONE init state, and a count would film whichever episodes ran first.
  CAPTURE_EPISODES: '0:0,1:0'
  # 400 steps / 10 = 40 frames per arm per episode, at 256x256. Enough to pick
  # a well-spaced 6-frame strip after the fact without re-running the job, and
  # ~250 PNGs total, which is nothing against a 512 GB disk.
  CAPTURE_EVERY: '10'

  # Per-step reasoning (k=1), matching the protocol the reported SR was
  # measured under. A refreshed-every-k figure would show motion produced by a
  # prefix up to k-1 steps stale, which is a different protocol -- and the
  # figure's whole claim is that the reader is seeing the run the paper reports.
  COT_REFRESH_STEPS: '1'

  # ~2.3 h/episode/arm at 400 steps with per-step CoT, x 3 arms x 2 episodes is
  # over the wall clock, so the budget stops it cleanly. The report flushes
  # every episode and frames are written as they are rendered, so a stop still
  # yields complete filmstrips for whatever finished.
  TIME_BUDGET_H: '20'
  ENV_SEED: '0'
  DTYPE: 'bfloat16'
  PROBE_ONLY: '0'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_rollout_edit_s3.sh
