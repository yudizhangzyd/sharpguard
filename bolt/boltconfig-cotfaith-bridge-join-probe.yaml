name: 'CoT-Faith #11 diag: measure the Bridge reasoning <-> LeRobot join (CPU)'
description: 'Diagnostic for the F4/O4 deconfound. Bolt fnwfaq9bq6 died in preflight having joined 0 of 606677 frames, and its log names the cause: the ECoT annotations are keyed by the authors'' absolute NFS paths, level 2 is an episode index in that shard, level 3 the step. The file is three levels deep; _ReasoningIndex assumed two. by_episode_index compared str(ep_idx) against path strings and could never hit; by_task_text then read a level-2 value (a dict of steps) as a reasoning dict, so first.get(''task'') was always None -- the log shows ''task-text index: 0 distinct tasks''. Two strategies, one shared wrong assumption, so the fallback did not save it. Rather than guess the fix and risk a second wasted GPU day, this measures the layout on CPU: nesting depth, key shapes per level, leaf fields, which field holds the instruction, and a per-strategy match count against LeRobot meta/episodes.jsonl. Also reports how many annotated episodes are reachable, since the LoRA config asks for 4000.'
tags:
- cotfaith
- bridge
- deconfound
- join-diagnostic
- cpu
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: yudi_zhang2
  viewers: yudi_zhang2
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 256
  timeout: 3h
  cluster: aws_6
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  TRANSFORMERS_VERBOSITY: error
  MAX_LEAVES: '0'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_bridge_join_probe.sh
