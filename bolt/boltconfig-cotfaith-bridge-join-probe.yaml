name: 'CoT-Faith #11b diag: score the Bridge join on the keys round 1 measured (CPU)'
description: 'Round 2 of the F4/O4 deconfound join diagnostic. Round 1 (j2kqu7k3m7) fixed the structure
  and voided its own answer: it scored both strategies against fields that do not exist (top-level keys
  are NFS paths; rec[''task''] is absent -- it is metadata.language_instruction), so ''no strategy matches''
  was a fact about the probe. This round scores keys measured present: metadata.episode_id vs LeRobot
  episode_index, CONFIRMED by instruction agreement on matched pairs, plus instruction text as fallback.
  An id overlap whose instructions disagree is flagged loudly -- the one outcome that yields a full, plausible,
  WRONG join index. It also measures RENDERABILITY: LIBERO packs all 8 CoT tags in one per-step dict,
  Bridge splits them across features (lists) and reasoning (dicts nobody has read), so the trainer must
  merge two subtrees per step and a perfect join into an unrenderable trace is still a dead end. Per-tag
  fill rate is reported from reasoning alone, features alone, and the merge.'
tags:
- cotfaith
- bridge
- deconfound
- join-diagnostic
- cpu
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: yudi_zhang2
  viewers: yudi_zhang2
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 256
  timeout: 3h
  cluster: aws_6
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  TRANSFORMERS_VERBOSITY: error
  MAX_EPISODES: '0'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_bridge_join_probe.sh
