name: 'CoT-Faith #11b diag: score the Bridge join on the keys round 1 measured (CPU)'
description: 'Round 2 of the F4/O4 deconfound join diagnostic. Round 1 (j2kqu7k3m7) settled the structure
  and voided its own answer: it scored by_episode_index against the TOP-level keys, which are absolute
  NFS paths, so 0 by construction, and by_task_text against rec[''task''], a field that does not exist.
  The field that does is metadata.language_instruction, and metadata.episode_id is present on all 60062
  episodes and nothing had looked at it. So round 1''s ''no strategy matches'' was a fact about the probe,
  not the data. This round scores keys measured to be present: episode_id vs LeRobot episode_index, CONFIRMED
  by instruction agreement on the matched pairs; instruction text as fallback with its fanout reported.
  An id overlap whose instructions disagree is flagged loudly -- it is the one outcome that would produce
  a full, plausible, WRONG join index. It also reports the LeRobot episode record''s full key set, since
  a source-path field there would make the join exact.'
tags:
- cotfaith
- bridge
- deconfound
- join-diagnostic
- cpu
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: yudi_zhang2
  viewers: yudi_zhang2
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 256
  timeout: 3h
  cluster: aws_6
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  TRANSFORMERS_VERBOSITY: error
  MAX_EPISODES: '0'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_bridge_join_probe.sh
