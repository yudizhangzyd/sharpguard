name: 'CoT-Faith AUROC: attention as failure predictor (Tier 3)'
description: 'For each LIBERO sample, greedy-decode action, compare to GT demo action, and correlate action-error with attention distribution. Binarize error at median → high/low-error labels. Compute AUROC of each attention feature (action->cot, ->visual, ->instr) as failure predictor. Mimics SAFE/FIPER methodology restricted to CoT-VLAs.'
tags: ['cotfaith', 'auroc', 'tier3']

project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 4h
  cluster: aws_2
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_HF_ID: 'Embodied-CoT/ecot-openvla-7b-bridge'
  N_SAMPLES: '200'
  SEED: '0'
  RVIS_LAYERS: '0,1,2,3'
  DTYPE: 'bfloat16'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_auroc.sh
