name: 'CoT-Faith decoder gate: OpenVLA-7B-finetuned-libero-object Task SR'
description: 'R1 reviewer critical #2 (decoder-validation gate). Reproduce the published ~85-95% Task SR of Kim et al. (CoRL 2024) on the matching LIBERO suite. The prior 0/20 was a SCORING bug in libero_sim.py (success was read from info["success"], a key LIBERO never sets, so solved episodes were counted as failures); that is now fixed to key off `done`/reward. This job is the published gate: no faithfulness number in the paper is interpretable until SR >= 0.80 here.'
tags: ['cotfaith', 'decoder-gate', 'rollout', 'libero-object']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 8gpu
  disk_gb: 512
  timeout: 6h
  cluster: aws_6

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  MODEL: 'openvla/openvla-7b-finetuned-libero-object'
  LIBERO_SUITE: 'libero_object'
  # Verified against the checkpoint's own dataset_statistics.json: the only key
  # present is 'libero_object'. Passing a '*_no_noops' variant makes
  # _get_norm_stats return None, which silently falls back to raw [-1,1]
  # actions and pins SR at 0.
  UNNORM_KEY: 'libero_object'

  N_EPS_PER_TASK: '5'   # 50 episodes across the suite's 10 tasks
  MAX_STEPS: '400'

  DTYPE: 'bfloat16'
  ATTN: 'eager'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_rollout_baseline.sh
