name: 'CoT-Faith data scout: verify Embodied-CoT LIBERO dataset structure'
description: 'Downloads Embodied-CoT/embodied_features_and_demos_libero (~35GB), walks file tree, tries tfds + hf_datasets + raw loaders, extracts 5 example samples with reasoning-structure hints. Blocker for building the ECoT-LIBERO fine-tune pipeline (task #81).'
tags: ['cotfaith', 'data-scout', 'week-1']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 3h
  cluster: aws_2

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  REPO_ID: 'Embodied-CoT/embodied_features_and_demos_libero'
  MAX_SAMPLES: '5'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_data_scout.sh
