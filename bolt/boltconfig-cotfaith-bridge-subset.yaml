name: 'CoT-Faith F4 deconfound: LoRA r=32 on 4k Bridge V2 subset (matched to LIBERO-90 scale)'
description: 'F4 confound: every "ours" row is ECoT-bridge fine-tuned on LIBERO, so a score shift could be changed CoT-action coupling OR merely domain match with the eval corpus. This trains the identical recipe on Bridge V2 (the base model pretraining domain), holding domain fixed so only the first cause can move. Join measured in bolt 754ru9usqe: episode_id is per-shard and its instructions agree on only 0.28 of matched pairs, so the trainer probes it, refuses it, and keys on instruction text -- 41634 reachable annotated episodes, median fanout 1. Degenerate keys are refused too: the shared keys include crowdsourced junk ("9", "3wsws") with a max fanout of 963, which would pair unrelated trajectories arbitrarily. The 8 CoT tags are split across features and reasoning, so every step is merged from both; reasoning alone renders VISIBLE OBJECTS and GRIPPER POSITION empty. The preflight streams 8 examples BEFORE the 7B load: exit 6 on zero joins, exit 7 if a tag renders empty in all of them.'
tags: ['cotfaith','deconfound','bridge-subset','F4']
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources: {docker_image: docker.apple.com/iris/iris:2.15.0, task_type: 1gpu, disk_gb: 512, timeout: 24h, cluster: aws_6}
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  BASE_MODEL: 'Embodied-CoT/ecot-openvla-7b-bridge'
  BRIDGE_DATASET: 'IPEC-COMMUNITY/bridge_orig_lerobot'
  BRIDGE_REASONING: 'Embodied-CoT/embodied_features_bridge'
  N_TRAJECTORIES: '4000'
  LORA_R: '32'
  LORA_ALPHA: '16'
  LR: '2e-5'
  STEPS: '15000'
  BATCH_SIZE: '2'
  DTYPE: 'bfloat16'
  SEED: '0'
  REASONING_MODE: 'full'
  MAX_STEPS_PER_EP: '0'
  # The preflight runs unconditionally; this only decides whether to stop after
  # it. Left at 0 so one job either produces the profile or dies cheaply.
  PREFLIGHT_ONLY: '0'
  # 8, not 3. The preflight now also checks what the joined CoT actually RENDERS,
  # and refuses when a tag is empty in every inspected sample -- the signature of
  # a missing features+reasoning merge (bolt 754ru9usqe: reasoning alone leaves
  # VISIBLE OBJECTS and GRIPPER POSITION at 0.0). Three samples cannot tell that
  # apart from an annotation that is merely sparse.
  PREFLIGHT_N: '8'
  RVIS_N_SAMPLES: '100'
  EDIT_N_SAMPLES: '100'
  EDIT_THRESHOLD: '0.05'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_bridge_subset.sh
