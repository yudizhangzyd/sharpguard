name: 'CoT-Faith F4 deconfound: LoRA r=32 on 4k Bridge V2 subset (matched to LIBERO-90 scale)'
description: 'F4 confound: every "ours" row is ECoT-bridge fine-tuned on LIBERO, and each scores differently from the base -- but two causes are entangled. Either fine-tuning changed the CoT-action coupling, or it moved the model in-domain for the evaluation corpus and the leaderboard is partly measuring domain match. This trains with the identical recipe on Bridge V2, the base model''s OWN domain, holding domain fixed so only the first can move. The recipe (prompt, 8-tag CoT render, action tokenizer, collator) is IMPORTED from cotfaith_train.py, not reimplemented: a deconfound whose recipe differs from what it deconfounds measures the difference in recipes. Four stages in one job because the deliverable is the calibration profile, not the checkpoint, and bolt pods cannot fetch cross-job artifacts. The reasoning<->trajectory join is unverified, so a preflight streams a few examples BEFORE the 7B load and exits 6 if it joins nothing; zero gradient steps refuses to save a checkpoint indistinguishable from the base.'
tags: ['cotfaith','deconfound','bridge-subset','F4']
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources: {docker_image: docker.apple.com/iris/iris:2.15.0, task_type: 1gpu, disk_gb: 512, timeout: 24h, cluster: aws_6}
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  BASE_MODEL: 'Embodied-CoT/ecot-openvla-7b-bridge'
  BRIDGE_DATASET: 'IPEC-COMMUNITY/bridge_orig_lerobot'
  BRIDGE_REASONING: 'Embodied-CoT/embodied_features_bridge'
  N_TRAJECTORIES: '4000'
  LORA_R: '32'
  LORA_ALPHA: '16'
  LR: '2e-5'
  STEPS: '15000'
  BATCH_SIZE: '2'
  DTYPE: 'bfloat16'
  SEED: '0'
  REASONING_MODE: 'full'
  MAX_STEPS_PER_EP: '0'
  # The preflight runs unconditionally; this only decides whether to stop after
  # it. Left at 0 so one job either produces the profile or dies cheaply.
  PREFLIGHT_ONLY: '0'
  PREFLIGHT_N: '3'
  RVIS_N_SAMPLES: '100'
  EDIT_N_SAMPLES: '100'
  EDIT_THRESHOLD: '0.05'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_bridge_subset.sh
