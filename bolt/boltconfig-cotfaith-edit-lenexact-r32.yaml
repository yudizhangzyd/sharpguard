name: 'CoT-Faith 13-family x 3-seed edit: paraphrase_null_lenexact on r=32 (4th null)'
description: 'Scores the F floor of a new null family, same protocol as the other ours rows. paraphrase_null_lenexact = paraphrase_null with release->free instead of release->"let go of", so every substitution is single-word-to-single-word: meaning-preserving AND length-exact. If its floor lands near paraphrase_nulls (0.567 on r=32), that argues against length driving the gap between the two existing floors; if it lands near syntactic_scrambles (0.348), that argues length matters more than which specific words changed. Either is a real result the two existing floors alone cannot distinguish. Task bcihypv3gu, same weights the published r=32 row was scored on.'
tags: ['cotfaith', 'edit', 'paraphrase_null_lenexact', 'floors', '4th-null']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 8h
  cluster: aws_6

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  AWS_ACCESS_KEY_ID: ${CKPT_AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${CKPT_AWS_SECRET_ACCESS_KEY}
  S3_ENDPOINT_URL: 'https://conductor.data.apple.com'
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_TASK_ID: 'bcihypv3gu'
  SEEDS: '0 1 2'
  FAMILIES: 'paraphrase_null_lenexact'
  N_SAMPLES: '100'
  THRESHOLD: '0.05'
  DTYPE: 'bfloat16'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_edit_s3ckpt.sh
