name: 'CoT-Faith #15e: OpenVLA-OFT load, round 6 (hold the stack the paper names)'
description: 'Round 5 (bolt 8ejjyfkzq8) fixed both round-4 failures -- wandb installs cleanly, no pydantic skew, 0 re-execs -- and exposed that three of its four cells still measured our environment, not OFT. (1) torch silently moved 2.4.1+cu118 to 2.2.0+cu121 when stage 3 restored the paper''s transformers pin with deps, so stages 3-4 were not the named stack; a pip constraints file now holds torch and the protobuf-4 world across every pip call, shell ones included. (2) Stage 4 forced timm>=1.0.11 and the checkpoint''s remote code refuses it (TIMM Version must be >= 0.9.10 and < 1.0.0), so that cell could not load for any transformers; timm now stays in the declared window. (3) The repair loop ping-ponged protobuf 4/5 for four rounds -- tensorflow wants <5, recent wandb >=5 -- ending with a wandb that cannot import; it now detects the alternation and refuses to pick a side. Stage 3 is the cell that matters: round 5''s 20 REFUSED lines show OFT wants exactly the paper''s pins.'
tags:
- cotfaith
- openvla-oft
- limitation-ix
- load-probe
- round6
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: yudi_zhang2
  viewers: yudi_zhang2
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 4h
  cluster: aws_6
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: error
  DTYPE: bfloat16
  OFT_REPOS: ''
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_oft_load_probe.sh
