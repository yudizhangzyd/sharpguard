name: 'CoT-Faith #15e: OpenVLA-OFT load, round 5 (fix the install policy, not the symptom)'
description: 'Round 4 (bolt s6arkzytjr) failed twice and both failures were ours, not OFT''s. (1) Its skew repair installed pydantic-core==2.46.4 successfully and the identical SystemError returned: pydantic_core is a compiled extension already imported, so no reinstall and no invalidate_caches() can swap the loaded object. (2) The stage that got past pydantic died on AttributeError: partially initialized module ''wandb'' has no attribute ''errors'' -- what wandb does when its requirements are absent. Both are --no-deps-everything producing partial installs, and both read in a log exactly like an OFT incompatibility. Round 5 fixes the policy: deps installed WITH their own deps, the four pins the paper names re-asserted afterwards with any movement reported; a pip-check repair before each stage in its OWN process, the only point at which a compiled-module conflict is fixable; a surviving skew triggers a bounded re-exec, not an in-process retry.'
tags:
- cotfaith
- openvla-oft
- limitation-ix
- load-probe
- round5
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: yudi_zhang2
  viewers: yudi_zhang2
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 4h
  cluster: aws_6
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: error
  DTYPE: bfloat16
  OFT_REPOS: ''
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_oft_load_probe.sh
