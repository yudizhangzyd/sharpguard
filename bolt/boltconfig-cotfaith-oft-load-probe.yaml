name: 'CoT-Faith #15d: OpenVLA-OFT load, round 4 (repair the version skew round 3 caused)'
description: 'Round 3 (bolt gvvhgg4d4c) got further than any prior round and then failed on its own doing: with prismatic resolved, all 5 OFT checkpoints reached the PROCESSOR stage, then died on SystemError -- installed pydantic-core 2.47.0 vs a pydantic requiring 2.46.4. That skew was created by the probe itself: its --no-deps retry loop installed pydantic_core alone to satisfy a missing-module error, leaving the coupled pair mismatched. A self-inflicted skew is not evidence that OFT is unloadable, so the paper cannot cite round 3 for limitation (ix). This round adds version_skew(): when a failure is not a missing module, the loop reads the version the exception itself names and pins to it, once per package, before reporting anything as the blocker. --no-deps is kept otherwise, because the pins ARE the environment the paper names. Every install is still recorded, so the output answers what supporting OFT would cost rather than just yes/no.'
tags:
- cotfaith
- openvla-oft
- limitation-ix
- load-probe
- round3
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: yudi_zhang2
  viewers: yudi_zhang2
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 4h
  cluster: aws_6
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: error
  DTYPE: bfloat16
  OFT_REPOS: ''
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_oft_load_probe.sh
