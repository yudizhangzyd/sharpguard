name: 'CoT-Faith: rollout-level CoT-edit PROBE (preconditions before a 24h run)'
description: 'Limitation (v): every leaderboard number is a first-step quantity -- perturb the CoT, decode one action, measure the shift. That shows the CoT is read, not that reading it matters for finishing the task. cotfaith_rollout_edit.py runs the same episode twice from one canonical init state, once with the model''s own CoT and once with it edited, comparing task SR paired via exact McNemar. This is the PROBE: it answers in minutes what would otherwise waste a 24h job. (1) Which norm_stats keys the checkpoint carries -- a missing suite key sends actions to env.step() at raw [-1,1] scale and pins SR at 0 for reasons unrelated to CoT. (2) Whether it emits parseable 9-tag CoT online, and at what seconds/step, which decides if a full run fits the clock. (3) Whether each family changes the RENDERED prefix -- one that renders identically is inapplicable, like bbox_jitter_null on DeepThinkVLA, and is recorded as such rather than scored as a passing null.'
tags: ['cotfaith', 'rollout-edit', 'probe', 'limitation-v']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 4h
  cluster: aws_6

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  CKPT_PATH: 'Embodied-CoT/ecot-openvla-7b-bridge'
  SUITE: 'libero_spatial'
  # Deliberately the key we expect to be ABSENT. The probe reports every key the
  # checkpoint actually carries, so asking for the one a LIBERO rollout needs is
  # what turns "we think the scale is wrong" into a recorded fact.
  UNNORM_KEY: 'libero_spatial_no_noops'
  # One semantic edit plus the paraphrase null, so any effect has its own
  # control inside the same run rather than across jobs.
  FAMILIES: 'direction_flip,paraphrase_null,subject_swap,gripper_flip'
  MAX_NEW_TOKENS: '320'
  GRIPPER_TRANSFORM: 'openvla'
  IMAGE_PREPROC: 'none'
  DTYPE: 'bfloat16'
  PROBE_ONLY: '1'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_rollout_edit.sh
