name: 'CoT-Faith gate factorial (exact preproc): gripper x image on libero_object'
description: 'Gate preflight with upstream-EXACT frame preprocessing. bolt htrg4uchwi read openvla/openvla and found two real gaps in our harness: upstream binarizes then inverts the gripper dim (composition -sign(2g-1); we did neither), and it JPEG-round-trips plus lanczos3-resizes every frame to 224 because the training images went through that path (we handed the raw 256px render straight to the processor). Two changes means one A/B cannot attribute anything, so this is a 2x2: gripper {none, openvla} x image {none, tf_upstream}. The earlier run (i55ww23d5n) used a Pillow stand-in for the resize; bolt d543p4f86p then measured that tensorflow CAN coexist with this env (numpy pin unmoved, torch CUDA intact, is_tf_available False under USE_TF=0), so this run calls tf.image.resize itself and is exact rather than 8/255 approximate. The none+none cell reproduces the four failed gates, so a null is distinguishable from a broken harness. libero_object, upstream 280 steps, 4 episodes per cell.'
tags: ['cotfaith', 'decoder-gate', 'factorial', 'preflight']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 4h   # 4 cells x 4 episodes x <=280 steps; ~50 min expected
  cluster: aws_2  # A100. NOT aws_10: its B200s are sm_100 and this image's torch caps at sm_90.

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  # Opt in to tensorflow-cpu for the exact resize, and tell transformers not to
  # probe for it at import (the ABI hazard the old setup comment warned about;
  # measured harmless under this flag by d543p4f86p, but the flag is what makes
  # it harmless so it is not optional).
  INSTALL_TF: '1'
  USE_TF: '0'
  TRANSFORMERS_NO_TF: '1'
  USE_TORCH: '1'

  MODEL: 'openvla/openvla-7b-finetuned-libero-object'
  LIBERO_SUITE: 'libero_object'
  UNNORM_KEY: 'libero_object'

  N_EPISODES: '4'
  # Upstream's own budget for this suite, read from run_libero_eval.py by
  # htrg4uchwi. The earlier gate ran a flat 400 everywhere, which was harmless
  # here but truncated every libero_10 episode.
  MAX_STEPS: '280'
  ARMS: 'none,openvla'
  # tf_upstream, not the Pillow approximation: d543p4f86p established that
  # tensorflow coexists with this environment, so there is no reason to run an
  # 8/255-approximate stand-in for the arm whose whole purpose is to match
  # upstream. INSTALL_TF=1 above is what puts tensorflow-cpu in the image.
  IMAGE_PREPROCS: 'none,tf_upstream'
  WIN_THRESHOLD: '0.5'

  DTYPE: 'bfloat16'
  ATTN: 'eager'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_gripper_ab.sh
