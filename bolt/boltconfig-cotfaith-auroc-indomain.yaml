name: 'CoT-Faith P3 re-run, in-domain: AUROC on Bridge V2 with the checkpoints own norm stats'
description: 'P3 was withdrawn for a protocol defect, and this is the corrected run. The withdrawn version compared a NORMALIZED predicted action (dequantize gives [-1,1]) against a ground-truth action in the robots own units, so the residual it thresholded was dominated by a per-dimension constant offset, not by model error -- and the AUROC labels are a median split on exactly that residual. It also scored a Bridge-trained ECoT checkpoint on LIBERO, where the checkpoint carries no matching action statistics, so no correct un-normalization existed. Fixes: prediction un-normalized with the checkpoints own q01/q99 for bridge_orig, abort if the key is absent, corpus switched to Bridge V2 (in-domain, CoT self-generated since Bridge has no GT reasoning), and GT mapped onto the token grid before the teacher-forced attention pass. The withdrawn quantity is recomputed on the same forward passes and reported beside the corrected one.'
tags: ['cotfaith', 'auroc', 'p3', 'in-domain', 'protocol-fix']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 12h
  cluster: aws_6                # NOT aws_10: p6-b200 is sm_100, this image's torch stops at sm_90

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_HF_ID: 'Embodied-CoT/ecot-openvla-7b-bridge'
  CORPUS: 'bridge_v2'
  UNNORM_KEY: 'bridge_orig'
  BRIDGE_REPO: 'IPEC-COMMUNITY/bridge_orig_lerobot'
  N_SAMPLES: '200'
  SEED: '0'
  RVIS_LAYERS: '0,1,2,3'
  DTYPE: 'bfloat16'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_auroc.sh
