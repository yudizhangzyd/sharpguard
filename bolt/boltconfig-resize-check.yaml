name: 'CoT-Faith resize check: is our numpy lanczos3 bit-identical to upstream?'
description: 'Decoder-gate support job, round 2. The reference diff (htrg4uchwi) showed upstream prepares every LIBERO frame with a JPEG round-trip plus tf.image.resize(lanczos3, antialias=True) to 224px; our four failed gates did none of it, and the gate cannot import tensorflow (setup-openvla.sh:41: it clobbers the numpy<2 pin). Round 1 (q5z79humta) tried Pillow LANCZOS and measured it FAILING the ceiling fixed beforehand -- 23/255 LSB vs a limit of 4 -- so the kernel was reimplemented in numpy from the definition. This job validates that. It builds a throwaway tensorflow-cpu venv, imports the SHIPPED image_preproc.py by path so it tests the deployed function not a copy, and measures three things: the JPEG step alone (sweeping Pillow subsampling 0/1/2), the resize kernel alone, and the full pipeline. Thresholds fixed in advance: 0 LSB means we may claim reproduction outright, <=1 to within one intensity level, <=4 usable with a caveat, larger means the claim does not ship. CPU only.'
tags: ['cotfaith', 'decoder-gate', 'resize-check', 'preflight']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu   # nothing here uses the GPU; 1gpu is the smallest shape that schedules promptly
  disk_gb: 64
  timeout: 40m
  cluster: aws_2

environment_variables:
  # No setup_command: the job builds its own venv precisely so that nothing it
  # installs can reach the shared eval environment.
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

command: bash bolt/run_resize_check.sh
