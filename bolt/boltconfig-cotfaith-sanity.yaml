name: 'CoT-Faith sanity test: verify our ECoT-LIBERO produces LIBERO reasoning'
description: 'Loads the merged_model from cotfaith-train job jsyc64ngfs and runs predict_action on a REAL LIBERO scene image (first sample of Embodied-CoT LIBERO dataset). Verdict: PASS if all 9 ECoT tags emit + reasoning mentions LIBERO-domain objects (not Bridge-domain). PARTIAL/FAIL indicates training did not fully transfer.'
tags: ['cotfaith', 'sanity', 'week-2']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 2h
  cluster: aws_2

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  # Task ID that produced our merged_model (the full 15k-step run).
  CKPT_TASK_ID: 'jsyc64ngfs'
  DATASET_REPO: 'Embodied-CoT/embodied_features_and_demos_libero'
  DTYPE: 'bfloat16'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_sanity.sh
