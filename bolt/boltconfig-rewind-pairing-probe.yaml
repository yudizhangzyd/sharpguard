name: 'CoT-Faith #10d: rewind-pairing probe -- identical prompts, identical trajectories'
description: 'Sufficiency check for the filmstrip pairing: settle once, rewind three times, replay ONE fixed action sequence each time, require identical qpos and pixels. Run 1 (gzv4nuhtfe) failed as designed and named the gripper accumulator. Run 5 (e268dqs2t8) then left an anomaly: qpos bit-identical at all 40 steps, the renderer bit-exact on one state rendered 4 times, no frame offset in +-3, and the frames still differing inside rows 158-255 cols 101-197 whose complement was bit-identical, in the shape of the arm. Diagnosis: robosuite samples camera observables INSIDE the physics substep loop on each observable own timer, so a control step returns a render from whichever substep it fired on, and that timer is neither qpos nor qvel -- two arms draw the same physics a substep apart. The settle now snapshots the sampling phase and every rewind restores it. Run 6 adds a diff of every render input, a re-render from a saved state, and the phase read before and after each rewind.'
tags: ['cotfaith', 'rollout-edit', 'pairing', 'limitation-v', 'probe']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  # 1gpu rather than cpu: the setup script builds the same LIBERO/EGL stack the
  # capture uses, and the probe must exercise THAT stack -- a pairing property
  # verified against a different renderer is a property of a different run.
  task_type: 1gpu
  disk_gb: 256
  timeout: 2h
  cluster: aws_6

environment_variables:
  SUITE: 'libero_90'
  PROBE_STEPS: '40'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_probe_rewind_pairing.sh
