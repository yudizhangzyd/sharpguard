name: 'CoT-Faith 13-family x 3-seed edit: r=32 at 8x training steps (Stage 3 checkpoint)'
description: 'Decouples the two confounds Limitations flags on the F_dir result: the six clearing LoRA/data variants are exactly the six with weak open-loop competence AND collapsed (near-single-axis) action spaces, while ECoT-bridge -- competent AND rich-action-space -- clears at only 2.6x, not 6.6-11.1x. Runs the SAME 13-family x 3-seed x 100-sample protocol as the other seven ours rows, on task 3xrnsh3xsz: SAME r=32/LR=2e-5/libero_lm_90 recipe as the published r=32 row, just 120,000 steps not 15,000. If more training raises competence and/or un-collapses the action space, comparing this rows F_dir clearance and zero-bin fraction against the published r=32 row separates which confound it tracks -- using a checkpoint that already exists, no new training.'
tags: ['cotfaith', 'edit', 'calibration', 'seeds', 'stage3', 'fdir-confound']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 12h
  cluster: aws_6                # NOT aws_10: p6-b200 is sm_100, this image's torch stops at sm_90

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  # Task-scoped, expiring read token for the training task's artifact prefix,
  # issued at submit time by `bolt task get-credentials $CKPT_TASK_ID`. The pod
  # has no IAM role for this bucket; without these the sync dies at
  # NoCredentialProviders, which is how the first seven submissions failed.
  AWS_ACCESS_KEY_ID: ${CKPT_AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${CKPT_AWS_SECRET_ACCESS_KEY}
  S3_ENDPOINT_URL: 'https://conductor.data.apple.com'
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_TASK_ID: '3xrnsh3xsz'
  SEEDS: '0 1 2'
  N_SAMPLES: '100'
  THRESHOLD: '0.05'
  DTYPE: 'bfloat16'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_edit_s3ckpt.sh
