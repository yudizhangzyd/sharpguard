name: 'CoT-Faith prompt-format ablation on ECoT-bridge (5 variants)'
description: 'Ablates parts of the 9-tag CoT (full, task_only, plan_only, task_plan_subtask, shuffled, empty). Measures action delta vs full-CoT baseline to identify which segments are load-bearing.'
tags: ['cotfaith', 'prompt-ablation', 'tier2']

project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 3h
  cluster: aws_2
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_HF_ID: 'Embodied-CoT/ecot-openvla-7b-bridge'
  N_SAMPLES: '100'
  SEED: '0'
  EDIT_THRESHOLD: '0.05'
  DTYPE: 'bfloat16'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_prompt.sh
