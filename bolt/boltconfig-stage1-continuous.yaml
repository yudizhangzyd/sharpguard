name: 'CoT-Faith Stage 1: continuous effect size + policy-likelihood covariate'
description: 'Threshold-free effect size (per-dim TV/KL divergence + expected-action L2 between policy softmax under original vs edited CoT) fused with a teacher-forced delta-logp covariate for the edited CoT under the policys own LM head. 9 edit families x 6 checkpoints (ECoT-bridge, DeepThinkVLA base/SFT/RL, our LoRA r=32/r=64), ~100 samples each, two transformers-pin phases. Phase A (ECoT-bridge/r32/r64) runs one checkpoint at a time, not concurrently: two prior full attempts had the 3rd-launched OpenVLA-family process die on a transformers ImportError every time, and an isolation test (task 7nt9apejet) proved it alone was not the problem. Phase B (DeepThinkVLA x3) stays concurrent -- never shown this failure. Plus a Mistral-7B-Instruct-v0.2 second-judge pass on the existing held-out pairs for inter-judge agreement. Replaces the argmax-thresholded scores collision-counter behavior with a continuous statistic. Budget ~5 A100-h; timeout 6h to cover Phase As now-serialized wall clock.'
tags: ['cotfaith', 'stage1', 'continuous-metric', 'tv-divergence', 'delta-logp', 'reviewer-priority']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 8gpu                # Phase B (3 concurrent) + judge (1 concurrent) still need multiple GPUs at once; Phase A is now sequential on 1
  disk_gb: 2048                  # LIBERO dataset snapshot (~17GB, fetched once) + up to 6 checkpoints' weights cached at once
  timeout: 6h                    # was 2h/~40min-parallel-estimate; Phase A serialized to fix gc9ykqissb/yiertxskku -- ~3x its own wall clock, so tripled with margin
  cluster: aws_2                 # A100. NOT aws_10: its B200s are sm_100 and this image's torch caps at sm_90.

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  DATASET_REPO: 'Embodied-CoT/embodied_features_and_demos_libero'
  TFDS_SUBDIR: 'libero_lm_90/1.0.0'
  REASONING_JSON: 'libero_reasonings.json'
  N_SAMPLES: '100'
  SEED: '0'
  FAMILIES: 'direction_flip,gripper_flip,verb_swap,negation,subject_swap,location_swap,adversarial_plausible,paraphrase_null,syntactic_scramble'
  DTYPE: 'bfloat16'
  KL_EPS: '1e-6'

  # OpenVLA-family (Phase A, transformers 4.40.1). ECoT-bridge is a public HF
  # checkpoint; confirmed at bolt/boltconfig-cotfaith-edit-ecot-bridge.yaml.
  ECOT_BRIDGE_HF_ID: 'Embodied-CoT/ecot-openvla-7b-bridge'

  # LoRA r=32 / r=64 are this project's OWN fine-tunes, fetched from the S3
  # artifacts of their original training tasks -- not an HF repo. Task ids
  # confirmed from bolt/boltconfig-cotfaith-edit13-r32.yaml (CKPT_TASK_ID:
  # bcihypv3gu) and bolt/boltconfig-cotfaith-edit13-r64.yaml (CKPT_TASK_ID:
  # 26whnbbrmb); same mapping as bolt/submit_edit13.sh's ROWS array.
  #
  # Each token is scoped to ONE task prefix (a token for one task gets
  # AccessDenied on the other -- see bolt/submit_edit13.sh), so this job needs
  # TWO. Bolt does NOT expand ${VAR} placeholders from the submitting shell
  # (see bolt/submit_edit13.sh's own comment on this), so these four MUST be
  # rendered to real values before `bolt task submit`, the same way
  # bolt/submit_edit13.sh renders its single credential pair -- do not submit
  # this config with the literal placeholders below still in place.
  LORA_R32_CKPT_TASK_ID: 'bcihypv3gu'
  LORA_R32_AWS_ACCESS_KEY_ID: ${LORA_R32_AWS_ACCESS_KEY_ID}
  LORA_R32_AWS_SECRET_ACCESS_KEY: ${LORA_R32_AWS_SECRET_ACCESS_KEY}
  LORA_R64_CKPT_TASK_ID: '26whnbbrmb'
  LORA_R64_AWS_ACCESS_KEY_ID: ${LORA_R64_AWS_ACCESS_KEY_ID}
  LORA_R64_AWS_SECRET_ACCESS_KEY: ${LORA_R64_AWS_SECRET_ACCESS_KEY}
  S3_ENDPOINT_URL: 'https://conductor.data.apple.com'

  # DeepThinkVLA (Phase B, transformers upgraded in-command to 4.48.1).
  # Confirmed at bolt/boltconfig-cotfaith-deepthink-{base,libero-cot-sft,libero-cot-rl}.yaml.
  DT_BASE_HF_ID: 'yinchenghust/deepthinkvla_base'
  DT_SFT_HF_ID: 'yinchenghust/deepthinkvla_libero_cot_sft'
  DT_RL_HF_ID: 'yinchenghust/deepthinkvla_libero_cot_rl'

  # Second-judge add-on: forces Mistral (rather than the tried-in-order
  # fallback list) over the SAME held-out pairs as the existing Qwen run.
  # Settings copied from bolt/boltconfig-cotfaith-judge-edits.yaml so the two
  # runs sample identical pairs (same seed -> identical build_pairs() output).
  JUDGE_MODELS: 'mistralai/Mistral-7B-Instruct-v0.2'
  JUDGE_REASONING_REPO: 'Embodied-CoT/embodied_features_and_demos_libero'
  JUDGE_REASONING_FILE: 'libero_reasonings.json'
  JUDGE_FILE_BASE_FROM: 'results_v2/canonical_runs/ecot_bridge_edit_seed1.json'
  JUDGE_N_SAMPLES: '40'
  JUDGE_FAMILIES: 'paraphrase_null,bbox_jitter_null,syntactic_scramble,direction_flip,negation,subject_swap,verb_swap,gripper_flip,location_swap,cross_task_swap,adversarial_plausible'
  JUDGE_SEED: '0'
  JUDGE_MAX_NEW_TOKENS: '160'
  JUDGE_TIME_BUDGET_H: '1.5'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_stage1_continuous.sh
