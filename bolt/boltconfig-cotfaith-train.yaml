name: 'CoT-Faith: fine-tune ECoT-bridge on LIBERO (own CoT-VLA #2)'
description: 'LoRA r=32 fine-tune of Embodied-CoT/ecot-openvla-7b-bridge on Embodied-CoT/embodied_features_and_demos_libero to produce a LIBERO-native CoT-VLA. Uses standard 9-tag ECoT prompt/target format. 15k steps, LR 2e-5, bf16. Target: N_CoT = 2 for the CoT-Faith study (ECoT bridge + own LIBERO variant).'
tags: ['cotfaith', 'ecot-libero', 'train', 'week-2']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 8gpu
  disk_gb: 1024
  timeout: 24h
  cluster: aws_2

environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'

  BASE_MODEL: 'Embodied-CoT/ecot-openvla-7b-bridge'
  DATASET_REPO: 'Embodied-CoT/embodied_features_and_demos_libero'
  TFDS_SUBDIR: 'libero_lm_90/1.0.0'
  REASONING_JSON: 'libero_reasonings.json'

  LORA_R: '32'
  LORA_ALPHA: '16'
  LR: '2e-5'
  STEPS: '15000'
  BATCH_SIZE: '2'
  MAX_STEPS_PER_EP: '0'
  DTYPE: 'bfloat16'
  SEED: '0'

setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_train.sh
