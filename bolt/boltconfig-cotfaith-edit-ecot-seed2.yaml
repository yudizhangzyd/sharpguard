name: 'CoT-Faith seed=2 rerun: ECoT-bridge 11-family edit'
description: 'Second seed for mean+/-std on the ECoT-bridge row (R3 review: statistical protocol needs ≥2 seeds).'
tags: ['cotfaith','edit','ecot-bridge','seed-2']
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources: {docker_image: docker.apple.com/iris/iris:2.15.0, task_type: 1gpu, disk_gb: 512, timeout: 4h, cluster: aws_6}
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_HF_ID: 'Embodied-CoT/ecot-openvla-7b-bridge'
  N_SAMPLES: '100'
  SEED: '2'
  THRESHOLD: '0.05'
  DTYPE: 'bfloat16'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_edit_only.sh
