name: 'CoT-Faith: DeepThinkVLA (libero-cot-sft) rvis + edit'
description: 'Cross-family P2: DeepThinkVLA is a pi0fast-initialized PaliGemma, not OpenVLA. Actions decode in ONE forward pass under a hybrid causal/bidirectional mask over 70 positions (10 chunk steps x 7 DoF), ids 254976-257023 with a REVERSED bin index, un-normalized by q01/q99. Uses the vendored upstream MIT model class (sharpguard/vendor/deepthinkvla) and PINS transformers==4.48.1. Runs rvis (P1) plus all 11 edit families.'
tags: ['cotfaith', 'deepthink', 'libero-cot-sft']

project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 3h
  cluster: aws_2
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_HF_ID: 'yinchenghust/deepthinkvla_libero_cot_sft'
  N_SAMPLES: '100'
  SEED: '0'
  DTYPE: 'bfloat16'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_deepthink.sh
