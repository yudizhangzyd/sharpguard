name: 'CoT-Faith: DeepThinkVLA (libero-cot-sft) rvis + edit'
description: 'Cross-family evaluation: DeepThinkVLA is PaliGemma-based (OpenpiFastOft arch), not OpenVLA. Uses transformers>=4.45. Evaluates rvis + 3 edit families (subject_swap, direction_flip, gripper_flip).'
tags: ['cotfaith', 'deepthink', 'libero-cot-sft']

project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 512
  timeout: 3h
  cluster: aws_2
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
  TRANSFORMERS_VERBOSITY: 'error'
  CKPT_HF_ID: 'yinchenghust/deepthinkvla_libero_cot_sft'
  N_SAMPLES: '100'
  SEED: '0'
  DTYPE: 'bfloat16'
setup_command: bash bolt/setup-openvla.sh
command: bash bolt/run_cotfaith_deepthink.sh
