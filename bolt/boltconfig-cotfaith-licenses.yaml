name: 'CoT-Faith R1: resolve upstream licenses for the datasheet'
description: 'R1 reviewer min-lift #4 (datasheet/license/data-card). The submission has no LICENSE file and no datasheet, and the local dev box has no route to huggingface.co, so the license column would otherwise be guessed. This job queries the HF Hub API for all 14 upstream assets and records what is actually declared -- including assets that declare nothing, which the datasheet then discloses as unknown instead of inventing a license.'
tags: ['cotfaith', 'datasheet', 'licenses', 'r1']
project_id: ads_algo_signal_qucacheoffline
permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'
priority: 1
resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu
  disk_gb: 64
  timeout: 1h
  cluster: aws_6
environment_variables:
  HF_HOME: /tmp/hf
  HF_HUB_OFFLINE: '0'
  HF_TOKEN: ${HF_TOKEN}
command: bash bolt/run_fetch_licenses.sh
