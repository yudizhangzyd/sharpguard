name: 'CoT-Faith: re-verify all 15 bibliography entries off the authoring host'
description: 'Independent re-run of the bibliography check from a different host and network path. A fabricated reference is grounds for rejection on its own, and it is the cheapest mistake an LLM-assisted workflow can make, so the bibliography is checked against a registry rather than proofread. The check found six real defects in 15 entries: five printed exactly five authors joined by "and", reading as complete lists where arXiv gives 7, 7, 7, 11 and 14, and one had our own shorthand "(OpenVLA-OFT)" inside the registered title. All six are fixed. The first run (qrpd3f8z58) was meant to reach DBLP for the five venue-only citations that print no arXiv id; DBLP times out from bolt as well as 403ing here. The real fix was that those five needed an arXiv TITLE search -- the script had only queried arXiv when an entry printed an id -- and all 15 now confirm. This run tests whether that holds off the authoring machine. Fifteen HTTP GETs, stdlib only. Nonzero exit only on CONTRADICTION.'
tags: ['cotfaith', 'citations', 'paper-audit', 'preflight']

project_id: ads_algo_signal_qucacheoffline

permissions:
  owners: 'yudi_zhang2'
  viewers: 'yudi_zhang2'

priority: 1

resources:
  docker_image: docker.apple.com/iris/iris:2.15.0
  task_type: 1gpu   # nothing here uses the GPU; 1gpu is the smallest shape that schedules promptly
  disk_gb: 16
  timeout: 20m
  cluster: aws_2

environment_variables:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

command: bash bolt/run_citation_check.sh
